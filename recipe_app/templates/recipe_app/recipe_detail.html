<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ recipe.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            margin: 20px;
        }
        h1, h2 {
            color: black;
        }
        a {
            color: blue;
            text-decoration: underline;
        }
        .meta {
            color: gray;
            font-size: 13px;
            margin-bottom: 15px;
        }
        .box {
            border: 1px solid gray;
            padding: 15px;
            margin-bottom: 20px;
            background-color: white;
            white-space: pre-wrap;
            font-family: Arial, sans-serif;
            font-size: 14px;
            color: black;
        }
    </style>
</head>
<body>
    <p><a href="/">&larr; Назад к списку рецептов</a></p>

    <h1>{{ recipe.title }}</h1>
    <div class="meta">
        Категория: {{ recipe.category.name }} | Дата: {{ recipe.published_at|date:"d.m.Y" }}
    </div>

    <h2>Описание:</h2>
    <p>{{ recipe.description }}</p>

    <h2>Ингредиенты:</h2>
    <div class="box">{{ recipe.ingredients }}</div>

    <h2>Способ приготовления:</h2>
    <div class="box">{{ recipe.steps }}</div>

    <p><a href="/">&larr; Назад к списку рецептов</a></p>
</body>
</html>
